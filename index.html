
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jatin & Anisha - Wedding Invitation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FALLING FLOWERS ANIMATION -->

    <div class="flower" style="left: 3%; animation-duration: 8s; animation-delay: 0s;">🌸</div>
    <div class="flower" style="left: 10%; animation-duration: 11s; animation-delay: 2s;">🌼</div>
    <div class="flower" style="left: 17%; animation-duration: 9s; animation-delay: 1s;">🌺</div>
    <div class="flower" style="left: 24%; animation-duration: 12s; animation-delay: 4s;">🌸</div>
    <div class="flower" style="left: 31%; animation-duration: 8s; animation-delay: 3s;">🌿</div>
    <div class="flower" style="left: 38%; animation-duration: 10s; animation-delay: 1s;">🌼</div>
    <div class="flower" style="left: 45%; animation-duration: 9s; animation-delay: 5s;">🌸</div>
    <div class="flower" style="left: 52%; animation-duration: 11s; animation-delay: 2s;">🌺</div>
    <div class="flower" style="left: 59%; animation-duration: 8s; animation-delay: 4s;">🌼</div>
    <div class="flower" style="left: 66%; animation-duration: 12s; animation-delay: 1s;">🌸</div>

    <div class="flower" style="left: 73%; animation-duration: 10s; animation-delay: 3s;">🌿</div>
    <div class="flower" style="left: 80%; animation-duration: 9s; animation-delay: 5s;">🌺</div>
    <div class="flower" style="left: 87%; animation-duration: 11s; animation-delay: 2s;">🌸</div>
    <div class="flower" style="left: 94%; animation-duration: 8s; animation-delay: 4s;">🌼</div>
    <div class="flower" style="left: 7%; animation-duration: 12s; animation-delay: 6s;">🌺</div>
    <div class="flower" style="left: 14%; animation-duration: 9s; animation-delay: 3s;">🌸</div>
    <div class="flower" style="left: 21%; animation-duration: 10s; animation-delay: 5s;">🌼</div>
    <div class="flower" style="left: 28%; animation-duration: 8s; animation-delay: 2s;">🌿</div>
    <div class="flower" style="left: 35%; animation-duration: 11s; animation-delay: 4s;">🌸</div>
    <div class="flower" style="left: 42%; animation-duration: 9s; animation-delay: 6s;">🌺</div>

    <div class="flower" style="left: 49%; animation-duration: 12s; animation-delay: 1s;">🌼</div>
    <div class="flower" style="left: 56%; animation-duration: 8s; animation-delay: 5s;">🌸</div>
    <div class="flower" style="left: 63%; animation-duration: 10s; animation-delay: 3s;">🌺</div>
    <div class="flower" style="left: 70%; animation-duration: 9s; animation-delay: 6s;">🌿</div>
    <div class="flower" style="left: 77%; animation-duration: 11s; animation-delay: 1s;">🌸</div>
    <div class="flower" style="left: 84%; animation-duration: 8s; animation-delay: 4s;">🌼</div>
    <div class="flower" style="left: 91%; animation-duration: 12s; animation-delay: 2s;">🌺</div>
    <div class="flower" style="left: 98%; animation-duration: 10s; animation-delay: 5s;">🌸</div>
    <div class="flower" style="left: 40%; animation-duration: 9s; animation-delay: 7s;">🌼</div>
    <div class="flower" style="left: 60%; animation-duration: 11s; animation-delay: 8s;">🌺</div>


    <!-- ENVELOPE SECTION -->

    <div class="envelope-stage">

        <button
            class="envelope"
            id="envelope"
            type="button"
            aria-label="Open wedding invitation"
        >

            <!-- ENVELOPE BACK -->

            <div class="envelope-back"></div>


            <!-- WEDDING INVITATION CARD -->

            <div class="invitation-card">

                <div class="card-content">

                    <h2>Jatin & Anisha</h2>

                    <p>Together with their families</p>

                    <h3>Request the pleasure of your company</h3>

                    <p>At their Wedding Celebration</p>

                </div>

            </div>


            <!-- ENVELOPE FRONT -->

            <div class="envelope-front"></div>


            <!-- OPENING FLAP -->

            <div class="envelope-flap"></div>


            <!-- WAX SEAL WITH AJ MONOGRAM -->

            <div class="wax-seal">

                <img
                    src="AJ_wedding_monogram_transparent.png"
                    alt="AJ Wedding Monogram"
                    style="width: 85%; height: 85%; object-fit: contain;"
                >

            </div>

        </button>

    </div>


    <!-- BOTTOM INVITATION TEXT -->

    <div class="invitation-text">

        <h1>You're Invited</h1>

        <p>Tap the envelope to open your invitation</p>

    </div>


    <!-- ENVELOPE CLICK ANIMATION -->

    <script>

        const envelope = document.getElementById("envelope");

        envelope.addEventListener("click", function () {
            envelope.classList.toggle("open");
        });

    </script>

</body>
</html>
