
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#B4D0D1">

    <title>Jatin & Anisha | Wedding Invitation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         1. FALLING FLOWERS
    ====================================== -->

    <div class="flower-layer">

        <span class="flower">🌸</span>
        <span class="flower">🌼</span>
        <span class="flower">🌺</span>
        <span class="flower">🌿</span>
        <span class="flower">🌸</span>
        <span class="flower">🌼</span>
        <span class="flower">🌺</span>
        <span class="flower">🌸</span>
        <span class="flower">🌿</span>
        <span class="flower">🌼</span>

        <span class="flower">🌸</span>
        <span class="flower">🌺</span>
        <span class="flower">🌼</span>
        <span class="flower">🌸</span>
        <span class="flower">🌿</span>
        <span class="flower">🌺</span>
        <span class="flower">🌸</span>
        <span class="flower">🌼</span>
        <span class="flower">🌺</span>
        <span class="flower">🌸</span>

        <span class="flower">🌿</span>
        <span class="flower">🌼</span>
        <span class="flower">🌸</span>
        <span class="flower">🌺</span>
        <span class="flower">🌼</span>
        <span class="flower">🌸</span>
        <span class="flower">🌿</span>
        <span class="flower">🌺</span>
        <span class="flower">🌸</span>
        <span class="flower">🌼</span>

    </div>


    <!-- =====================================
         2. MAIN ENVELOPE SCREEN
    ====================================== -->

    <main class="main-screen" id="mainScreen">

        <!-- COMPLETE REALISTIC ENVELOPE -->

        <button
            class="envelope"
            id="envelope"
            type="button"
            aria-label="Open wedding envelope"
        >

            <!-- ENVELOPE PNG -->

            <img
                class="envelope-artwork"
                src="envelope_with_full_AJ_logo.png"
                alt="Jatin and Anisha wedding envelope"
            >

            <!-- SEPARATE AJ LOGO INSIDE WAX SEAL -->

            <div class="wax-seal">

                <img
                    src="AJ_full_logo.png"
                    alt="Complete AJ wedding logo"
                >

            </div>

        </button>


        <!-- INITIAL SCREEN TEXT -->

        <div class="invitation-text">

            <h1>You're Invited</h1>

            <p>
                Tap the envelope to open your invitation
            </p>

        </div>

    </main>


    <!-- =====================================
         3. EMPTY AQUA BACKGROUND AFTER CLICK
    ====================================== -->

    <section
        class="invitation-screen"
        id="invitationScreen"
        aria-label="Wedding invitation background"
    >
    </section>


    <!-- =====================================
         4. ENVELOPE TRANSITION
    ====================================== -->

    <script>

        const envelope =
            document.getElementById("envelope");

        const mainScreen =
            document.getElementById("mainScreen");

        const invitationScreen =
            document.getElementById("invitationScreen");


        let invitationOpened = false;


        // ENVELOPE CLICK

        envelope.addEventListener("click", function () {

            if (invitationOpened) {
                return;
            }

            invitationOpened = true;

            // Gentle envelope movement
            envelope.classList.add("opening");

            // Fade away the envelope screen
            setTimeout(function () {

                mainScreen.classList.add("hidden");

                // Show only the aqua background
                invitationScreen.classList.add("visible");

            }, 650);

        });

    </script>

</body>

</html>
